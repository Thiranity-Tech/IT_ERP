plugins {
    id "com.android.application"
}

def loadSdkDir = {
    def propertiesFile = rootProject.file("local.properties")
    def props = new java.util.Properties()
    if (propertiesFile.exists()) {
        propertiesFile.withInputStream { stream ->
            props.load(stream)
        }
    }
    return props.getProperty("sdk.dir")
}

def releaseTasksRequested = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }

def detectLanApiBaseUrl = {
    try {
        def candidate = java.net.NetworkInterface.networkInterfaces
                .findAll { iface ->
                    iface.isUp() && !iface.isLoopback() && !iface.isVirtual()
                }
                .collectMany { iface ->
                    iface.inetAddresses.toList().collect { addr -> [iface: iface, addr: addr] }
                }
                .find { entry ->
                    entry.addr instanceof java.net.Inet4Address &&
                    !entry.addr.loopbackAddress &&
                    entry.addr.hostAddress &&
                    !entry.addr.hostAddress.startsWith("169.254.") &&
                    entry.addr.siteLocalAddress &&
                    !entry.iface.name.toLowerCase().contains("docker") &&
                    !entry.iface.name.toLowerCase().contains("vbox") &&
                    !entry.iface.name.toLowerCase().contains("vmnet") &&
                    !entry.iface.name.toLowerCase().contains("hyper-v") &&
                    !entry.iface.name.toLowerCase().contains("virtual") &&
                    !entry.iface.name.toLowerCase().contains("tun") &&
                    !entry.iface.name.toLowerCase().contains("tap")
                }?.addr

        if (candidate) {
            return "http://${candidate.hostAddress}:3000"
        }
    } catch (ignored) {
        // Fall through to the configured release URL.
    }

    return null
}

def resolveReleaseApiBaseUrl = {
    def overrideUrl = project.findProperty("API_BASE_URL")
    if (overrideUrl) {
        return overrideUrl.toString().replaceAll(/\/+$/, "")
    }

    if (releaseTasksRequested) {
        println("Warning: API_BASE_URL was not provided for release. Falling back to a local/dev URL.")
    }
    return detectLanApiBaseUrl() ?: "http://10.0.2.2:3000"
}

def debugApiBaseUrl = detectLanApiBaseUrl() ?: "http://10.0.2.2:3000"
def releaseApiBaseUrl = resolveReleaseApiBaseUrl()
def webApiBaseUrl = releaseTasksRequested ? releaseApiBaseUrl : debugApiBaseUrl
def sdkDir = loadSdkDir()
def adbExecutable = sdkDir ? new File(new File(sdkDir), "platform-tools/adb.exe") : null

android {
    namespace "com.iterp.mobile"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            // The Android app is a packaged copy of the current web frontend.
            // Keeping it in the build directory prevents stale checked-in assets
            // from being shipped after the frontend changes.
            assets.srcDirs = ["$buildDir/generated/mobile-web"]
        }
    }

    defaultConfig {
        applicationId "com.iterp.mobile"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${debugApiBaseUrl}\""
            buildConfigField "boolean", "ALLOW_API_SETTINGS", "true"
        }
        release {
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
            buildConfigField "boolean", "ALLOW_API_SETTINGS", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("buildWebFrontend", Exec) {
    workingDir rootProject.file("../frontend")
    commandLine "cmd", "/c", "npm run build"
}

tasks.register("syncWebFrontend", Sync) {
    dependsOn("buildWebFrontend")
    from rootProject.file("../frontend/dist")
    into "$buildDir/generated/mobile-web/web"
}

tasks.named("preBuild") {
    dependsOn("syncWebFrontend")
}

if (adbExecutable?.exists()) {
    tasks.register("reverseLocalPort", Exec) {
        commandLine adbExecutable.absolutePath, "reverse", "tcp:3000", "tcp:3000"
        ignoreExitValue true
    }

    tasks.matching { it.name == "preDebugBuild" }.configureEach {
        dependsOn("reverseLocalPort")
    }
}
